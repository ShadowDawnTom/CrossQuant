name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  build-macos:
    needs: verify
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify tag and runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"
          if [ "$IS_TAG" = "true" ]; then
            node -e 'const expected = `v${require("./package.json").version}`; if (process.env.RELEASE_TAG !== expected) throw new Error(`Tag ${process.env.RELEASE_TAG} must equal ${expected}`)'
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run test:bootstrap
      - run: npm run test:release
      - name: Build target-native bundle
        env:
          GCT_REQUIRE_CLEAN: '1'
        run: npm run release:bundle:macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: release/gate-crossex-darwin-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-windows:
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify tag and runner architecture
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if ((node -p 'process.arch') -ne $env:EXPECTED_ARCH) { throw "Unexpected runner architecture" }
          if ($env:IS_TAG -eq 'true') {
            node -e 'const expected = `v${require("./package.json").version}`; if (process.env.RELEASE_TAG !== expected) throw new Error(`Tag ${process.env.RELEASE_TAG} must equal ${expected}`)'
          }
      - run: npm ci --no-audit --no-fund
      - run: npm run test:bootstrap
      - run: npm run test:release
      - name: Build target-native bundle
        env:
          GCT_REQUIRE_CLEAN: '1'
        run: npm run release:bundle:windows
      - name: Test real install, startup, and uninstall
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/test-windows-release-install.ps1
          -ArchivePath release/gate-crossex-win32-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}
          path: release/gate-crossex-win32-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*'
          path: release
          merge-multiple: true
      - name: Generate release checksums
        run: |
          cd release
          sha256sum gate-crossex-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/gate-crossex-darwin-arm64.tar.gz
          release/gate-crossex-darwin-x64.tar.gz
          release/gate-crossex-win32-arm64.zip
          release/gate-crossex-win32-x64.zip
          release/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "Gate CrossEx $GITHUB_REF_NAME"
