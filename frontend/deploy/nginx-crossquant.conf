server {
    listen 80;
    listen [::]:80;
    server_name crossquant.shadowdawn.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name crossquant.shadowdawn.xyz;

    ssl_certificate /etc/letsencrypt/live/crossquant.shadowdawn.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crossquant.shadowdawn.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 公网实例只提供行情研究，不允许写入或删除 API 凭据。
    location ^~ /secure/ {
        return 403;
    }

    # 这三个 POST 是只读的历史行情查询，不会触发账户操作。
    location = /api/markets/funding-history {
        proxy_pass http://127.0.0.1:17840;
        include /etc/nginx/proxy_params;
    }

    location = /api/markets/funding-rankings {
        proxy_pass http://127.0.0.1:17840;
        include /etc/nginx/proxy_params;
    }

    location = /api/markets/funding-history/series {
        proxy_pass http://127.0.0.1:17840;
        include /etc/nginx/proxy_params;
    }

    # 允许访客确认风险提示并进入只读模式；没有凭据时后端无法进入实盘模式。
    location = /api/trading-mode {
        proxy_pass http://127.0.0.1:17840;
        include /etc/nginx/proxy_params;
    }

    # 其余 API 默认只允许读取，公网不能下单、转账或修改策略。
    location /api/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:17840;
        include /etc/nginx/proxy_params;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:17840;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/proxy_params;
    }

    location = /health {
        proxy_pass http://127.0.0.1:17840;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:17840;
        include /etc/nginx/proxy_params;
    }
}
